name: Ebuild Merge Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sys-kernel/cachyos-sources/**'
      - 'sys-kernel/cachyos-kernel/**'
      - 'sys-kernel/cachyos-kernel-bin/**'
      - 'virtual/dist-kernel/**'
      - '.github/workflows/ebuild-test.yml'
      - 'tests/test-ci-use-matrix.py'
      - 'tests/test-bin-headers-install.sh'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sys-kernel/cachyos-sources/**'
      - 'sys-kernel/cachyos-kernel/**'
      - 'sys-kernel/cachyos-kernel-bin/**'
      - 'virtual/dist-kernel/**'
      - '.github/workflows/ebuild-test.yml'
      - 'tests/test-ci-use-matrix.py'
      - 'tests/test-bin-headers-install.sh'
  workflow_dispatch:

jobs:
  validate-dist-kernel-links:
    runs-on: ubuntu-latest
    container:
      image: docker.io/gentoo/stage3:latest
      options: --privileged
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate CI USE matrix against ebuild requirements
      run: python3 tests/test-ci-use-matrix.py

    - name: Validate dist-kernel dependency resolution with emerge --pretend
      shell: bash
      run: |
        set -euo pipefail

        # Sync Gentoo repository snapshot
        for i in 1 2 3; do
          emerge-webrsync -q && break || sleep 10
        done

        # Configure local overlay
        mkdir -p /var/db/repos/cachyos-overlay /etc/portage/repos.conf /etc/portage/package.use
        cp -a ./. /var/db/repos/cachyos-overlay/
        cat > /etc/portage/repos.conf/cachyos.conf <<EOF
        [CachyOS-kernels]
        location = /var/db/repos/cachyos-overlay
        auto-sync = no
        priority = 50
        EOF

        echo 'ACCEPT_KEYWORDS="~amd64"' >> /etc/portage/make.conf
        cat > /etc/portage/package.use/kernel <<EOF
        >=dev-util/perf-7.2 libpfm
        >=sys-kernel/installkernel-70 dracut
        EOF

        echo "=== Validating sys-kernel/cachyos-kernel ebuilds ==="
        for ebuild in /var/db/repos/cachyos-overlay/sys-kernel/cachyos-kernel/cachyos-kernel-*.ebuild; do
          pkg=$(basename "$ebuild" .ebuild)
          echo "Testing dependency resolution for =sys-kernel/${pkg}"
          emerge --pretend --verbose "=sys-kernel/${pkg}"
        done

        echo "=== Validating virtual/dist-kernel ebuilds ==="
        for ebuild in /var/db/repos/cachyos-overlay/virtual/dist-kernel/dist-kernel-*.ebuild; do
          pkg=$(basename "$ebuild" .ebuild)
          echo "Testing dependency resolution for =virtual/${pkg}"
          emerge --pretend --verbose "=virtual/${pkg}"
        done

        echo "=== Validating sys-kernel/cachyos-kernel-bin ebuilds ==="
        for ebuild in /var/db/repos/cachyos-overlay/sys-kernel/cachyos-kernel-bin/cachyos-kernel-bin-*.ebuild; do
          pkg=$(basename "$ebuild" .ebuild)
          echo "Testing dependency resolution for =sys-kernel/${pkg}"
          emerge --pretend --verbose "=sys-kernel/${pkg}"
        done

    - name: Issue 57 regression - bin kernel installs real build tree
      shell: bash
      run: |
        set -euo pipefail
        # Install eselect in the Gentoo container for ROOT-scoped checks.
        emerge --quiet --verbose app-admin/eselect
        # The test sources the real ebuild src_install functions against
        # synthetic fixture packages and asserts the installed image has a
        # usable kernel build tree. No distfile downloads or kernel builds.
        bash tests/test-bin-headers-install.sh

  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history for git diff
    
    - name: Detect new ebuild versions
      id: detect
      run: |
        # Compare the complete pushed range so multi-commit pushes do not miss ebuilds.
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        elif [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${{ github.event.before }}^{commit}"; then
          BASE_SHA="${{ github.event.before }}"
        else
          BASE_SHA="HEAD~1"
        fi
        
        # Find new or modified ebuilds
        NEW_EBUILDS=$(git diff --no-renames --name-only --diff-filter=AM "$BASE_SHA" HEAD | \
          grep -E "^sys-kernel/cachyos-sources/cachyos-sources-.*\.ebuild$" | \
          grep -v "9999" | \
          sed -E 's|^sys-kernel/cachyos-sources/cachyos-sources-(.+)\.ebuild$|\1|' | \
          sort -V || true)
        
        # Also check if the workflow itself was modified
        WORKFLOW_CHANGED=$(git diff --no-renames --name-only --diff-filter=AM "$BASE_SHA" HEAD | \
          grep -E "^\.github/workflows/ebuild-test\.yml$" || true)
        
        if [ -z "$NEW_EBUILDS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -z "$WORKFLOW_CHANGED" ]; then
          echo "::notice::No new or modified ebuilds detected, skipping tests"
          echo "versions=[]" >> $GITHUB_OUTPUT
        else
          if [ -z "$NEW_EBUILDS" ]; then
            echo "Workflow changed or manual dispatch, testing latest version"
            LATEST=$(find sys-kernel/cachyos-sources -name "cachyos-sources-*.ebuild" | \
              grep -v "9999" | \
              sed -E 's|.*cachyos-sources-(.+)\.ebuild$|\1|' | \
              sort -V | tail -1)
            VERSIONS_JSON="[\"$LATEST\"]"
          else
            # Convert to JSON array
            VERSIONS_JSON="["
            first=true
            for version in $NEW_EBUILDS; do
              if [ "$first" = true ]; then
                VERSIONS_JSON="${VERSIONS_JSON}\"$version\""
                first=false
              else
                VERSIONS_JSON="${VERSIONS_JSON},\"$version\""
              fi
            done
            VERSIONS_JSON="${VERSIONS_JSON}]"
          fi
          
          echo "Versions to test: $VERSIONS_JSON"
          echo "versions=$VERSIONS_JSON" >> $GITHUB_OUTPUT
        fi

  test:
    needs: detect-versions
    if: needs.detect-versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}
        # Comprehensive test matrix based on all USE flags in the ebuild
        use_flags:
          # Default USE flags (scheduler and LTO defaults vary by version)
          - ""
          
          # === Scheduler Tests (mutually exclusive) ===
          - "bmq -bore -eevdf"
          - "bmq-lfbmq -bore -eevdf"
          - "eevdf -bore"
          - "rt -bore -eevdf"
          - "rt-bore -bore -eevdf"
          
          # === Special Configurations ===
          - "kcfi"
          - "deckify"
          - "deckify kcfi"
          
          # === Hz Tick Rate Tests (mutually exclusive) ===
          - "hz-ticks-100 -hz-ticks-1000"
          - "hz-ticks-250 -hz-ticks-1000"
          - "hz-ticks-300 -hz-ticks-1000"
          - "hz-ticks-500 -hz-ticks-1000"
          - "hz-ticks-600 -hz-ticks-1000"
          - "hz-ticks-750 -hz-ticks-1000"
          
          # === Tick Type Tests (mutually exclusive) ===
          - "tickrate-periodic -tickrate-full"
          - "tickrate-idle -tickrate-full"
          
          # === Preemption Mode Tests ===
          - "preempt-lazy -preempt-full"
          
          # === Compiler Optimization Tests ===
          - "o3"  # Default
          - "os -o3"
          - "debug -o3"
          
          # === Network and Performance ===
          - "bbr3"  # Default
          - "-bbr3"
          - "per-gov"  # Default
          - "-per-gov"
          
          # === Memory Management ===
          - "hugepage-always"  # Default
          - "hugepage-madvise -hugepage-always"
          
          # === CPU Architecture Optimization ===
          - "mnative"  # Default
          - "mgeneric -mnative"
          - "mgeneric-v1 -mnative"
          - "mgeneric-v2 -mnative"
          - "mgeneric-v3 -mnative"
          - "mgeneric-v4 -mnative"
          - "mzen4 -mnative"
          
          # === LLVM LTO Tests (mutually exclusive) ===
          - "llvm-lto-thin-dist -llvm-lto-thin -llvm-lto-full -llvm-lto-none"
          - "llvm-lto-thin -llvm-lto-thin-dist -llvm-lto-full -llvm-lto-none"
          - "llvm-lto-full -llvm-lto-thin -llvm-lto-thin-dist -llvm-lto-none -propeller"
          
          # === Advanced Optimization ===
          - "autofdo propeller llvm-lto-thin-dist -llvm-lto-thin -llvm-lto-full -llvm-lto-none"  # autofdo requires LTO, propeller conflicts with full LTO
          - "-autofdo -propeller"
          - "autofdo llvm-lto-thin -propeller -llvm-lto-thin-dist -llvm-lto-full -llvm-lto-none"
          - "propeller llvm-lto-thin-dist -llvm-lto-thin -llvm-lto-full -llvm-lto-none"  # propeller without autofdo
          - "autofdo llvm-lto-thin -llvm-lto-thin-dist -llvm-lto-full -llvm-lto-none"
          - "autofdo llvm-lto-full -propeller -llvm-lto-thin -llvm-lto-thin-dist -llvm-lto-none"  # propeller conflicts with full LTO
          
          # === ZFS Support ===
          - "kernel-builtin-zfs"
          
          # === Complex Real-world Combinations ===
          # Performance gaming setup
          - "bmq o3 bbr3 hz-ticks-1000 per-gov mzen4 -bore -eevdf -mnative"
          # Low latency audio workstation
          - "rt hz-ticks-1000 tickrate-full -bore -eevdf"
          # Power saving laptop
          - "eevdf os hz-ticks-250 tickrate-idle -per-gov -bore -tickrate-full -hz-ticks-1000 -o3"
          # Steam Deck optimized (deckify requires a BORE-family scheduler)
          - "deckify hz-ticks-500 o3 -hz-ticks-1000"
          # Development workstation with debugging
          - "debug eevdf tickrate-periodic -o3 -bore -tickrate-full"
          # Maximum optimization build
          - "bore o3 bbr3 autofdo propeller llvm-lto-thin mzen4 -eevdf -llvm-lto-thin-dist -llvm-lto-full -llvm-lto-none -mnative"
          # Conservative stable build
          - "eevdf mgeneric os -bore -o3 -autofdo -propeller -mnative"
          # RT audio production
          - "rt-bore hz-ticks-1000 o3 -bore -eevdf"
          # Virtual machine host
          - "eevdf hugepage-madvise tickrate-idle mgeneric-v3 -bore -hugepage-always -tickrate-full -mnative"
          # Container host optimized
          - "bore per-gov bbr3 hz-ticks-300 -eevdf -hz-ticks-1000"
          # Compile server optimized
          - "bmq llvm-lto-full os mgeneric-v4 -bore -eevdf -o3 -propeller -llvm-lto-thin -llvm-lto-thin-dist -llvm-lto-none -mnative"
          # Desktop with AutoFDO profiling
          - "bore autofdo llvm-lto-thin hz-ticks-1000 o3 -eevdf -llvm-lto-thin-dist -llvm-lto-full -llvm-lto-none"
          # Maximum compatibility
          - "eevdf mgeneric -bore -autofdo -propeller -kcfi -mnative"
          # KCFI security feature with RT
          - "kcfi rt-bore -bore -eevdf"
          
    container:
      image: docker.io/gentoo/stage3:latest
      options: --privileged
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Portage repository
      shell: bash
      run: |
        set -o pipefail

        # Random startup delay to stagger jobs hitting mirrors (0-30 seconds)
        STARTUP_DELAY=$(( RANDOM % 30 ))
        echo "Waiting ${STARTUP_DELAY} seconds before starting (stagger delay)..."
        sleep $STARTUP_DELAY

        # Create local overlay
        mkdir -p /var/db/repos/cachyos-overlay
        cp -r . /var/db/repos/cachyos-overlay/

        # Configure repos.conf
        mkdir -p /etc/portage/repos.conf
        cat > /etc/portage/repos.conf/cachyos.conf <<EOF
        [CachyOS-kernels]
        location = /var/db/repos/cachyos-overlay
        auto-sync = no
        priority = 50
        EOF

        # Configure binhost for faster dependency installation
        mkdir -p /etc/portage/binrepos.conf
        cat > /etc/portage/binrepos.conf/gentoobinhost.conf <<EOF
        [gentoobinhost]
        priority = 10
        sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64/
        EOF

        # Enable binary packages and accept testing keywords globally
        # Disable signature verification for CI environment
        echo 'FEATURES="${FEATURES} getbinpkg -news"' >> /etc/portage/make.conf
        echo 'ACCEPT_KEYWORDS="~amd64"' >> /etc/portage/make.conf

        # Sync main repo with retry on failures
        MAX_RETRIES=10
        BASE_DELAY=20

        for i in $(seq 1 $MAX_RETRIES); do
          echo "Attempt $i of $MAX_RETRIES: Syncing Gentoo repository..."

          # Use subshell to capture exit code without triggering set -e
          SYNC_EXIT_CODE=0
          emerge --sync -q 2>&1 | tee /tmp/sync.log || SYNC_EXIT_CODE=$?

          if [ $SYNC_EXIT_CODE -eq 0 ]; then
            echo "Repository sync successful"
            break
          else
            echo "emerge --sync failed with exit code $SYNC_EXIT_CODE"

            if [ $i -lt $MAX_RETRIES ]; then
              # Calculate random delay: base time + random 30-60 seconds
              RANDOM_EXTRA=$(( 30 + RANDOM % 31 ))
              RETRY_DELAY=$((BASE_DELAY + RANDOM_EXTRA))
              echo "Waiting ${RETRY_DELAY} seconds before retry (base: ${BASE_DELAY}s + random: ${RANDOM_EXTRA}s)..."
              sleep $RETRY_DELAY
            else
              echo "Max retries reached. Sync failed with exit code $SYNC_EXIT_CODE"
              exit $SYNC_EXIT_CODE
            fi
          fi
        done

        # getuto with retry (can also fail due to network issues)
        for i in $(seq 1 5); do
          echo "Attempt $i of 5: Running getuto..."
          GETUTO_EXIT_CODE=0
          getuto 2>&1 || GETUTO_EXIT_CODE=$?

          if [ $GETUTO_EXIT_CODE -eq 0 ]; then
            echo "getuto successful"
            break
          else
            echo "getuto failed with exit code $GETUTO_EXIT_CODE"
            if [ $i -lt 5 ]; then
              RETRY_DELAY=$(( 10 + RANDOM % 20 ))
              echo "Waiting ${RETRY_DELAY} seconds before retry..."
              sleep $RETRY_DELAY
            else
              echo "Max retries reached for getuto"
              exit $GETUTO_EXIT_CODE
            fi
          fi
        done
        
    - name: Configure package.use
      run: |
        EBUILD_PATH="sys-kernel/cachyos-sources/cachyos-sources-${{ matrix.version }}.ebuild"
        USE_FLAGS="${{ matrix.use_flags }}"

        # Scheduler and variant flags can be version-dependent. Skip a matrix
        # case when its positive selector is absent instead of creating an
        # invalid fallback build.
        read -r -a USE_FLAG_WORDS <<< "${USE_FLAGS}"
        for OPTIONAL_FLAG in bmq bmq-lfbmq deckify; do
          if printf '%s\n' "${USE_FLAG_WORDS[@]}" | grep -Fxq "${OPTIONAL_FLAG}" &&
             ! grep -Eq "(^|[[:space:]])\\+?${OPTIONAL_FLAG}([[:space:]]|$)" "${EBUILD_PATH}"; then
            echo "::notice::Skipping ${USE_FLAGS}: unsupported by cachyos-sources-${{ matrix.version }}"
            echo "SKIP_USE_CASE=true" >> "$GITHUB_ENV"
            exit 0
          fi
        done

        mkdir -p /etc/portage/package.use
        echo "sys-kernel/cachyos-sources ${USE_FLAGS}" > /etc/portage/package.use/cachyos-sources

        # Show the USE flags that will be used
        echo "Testing version ${{ matrix.version }} with USE flags: ${USE_FLAGS:-<default>}"
        emerge --pretend --verbose =sys-kernel/cachyos-sources-${{ matrix.version }} | grep USE

    - name: Install kernel sources
      if: env.SKIP_USE_CASE != 'true'
      run: |
        # Install the kernel sources package
        # This is a sources package, it doesn't compile anything, just installs sources
        # The ebuild should handle all dependencies correctly
        # Use --autounmask to automatically handle dependency USE flag requirements
        emerge --verbose --autounmask --autounmask-continue =sys-kernel/cachyos-sources-${{ matrix.version }}

        echo "✓ Successfully installed cachyos-sources-${{ matrix.version }} with USE='${{ matrix.use_flags }}'"
