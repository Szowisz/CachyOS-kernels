name: Ebuild Merge Test (musl-llvm)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sys-kernel/cachyos-sources/**'
      - '.github/workflows/ebuild-test-musl-llvm.yml'
      - 'tests/ci-portage-setup.sh'
      - 'tests/ci-binpkg-producer.sh'
      - 'tests/ci-binpkg-consumer.sh'
      - 'tests/ci_matrix_cases.py'
      - 'tests/test-ci-binpkg-lifecycle.py'
      - '.github/workflows/ebuild-binpkg-cleanup.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'sys-kernel/cachyos-sources/**'
      - '.github/workflows/ebuild-test-musl-llvm.yml'
      - 'tests/ci-portage-setup.sh'
      - 'tests/ci-binpkg-producer.sh'
      - 'tests/ci-binpkg-consumer.sh'
      - 'tests/ci_matrix_cases.py'
      - 'tests/test-ci-binpkg-lifecycle.py'
      - '.github/workflows/ebuild-binpkg-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
      image: ${{ steps.image.outputs.image }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect new ebuild versions
      id: detect
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
        elif [ "${{ github.event_name }}" = "push" ] &&
             [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${{ github.event.before }}^{commit}"; then
          BASE_SHA="${{ github.event.before }}"
        else
          BASE_SHA="HEAD~1"
        fi

        NEW_EBUILDS=$(git diff --no-renames --name-only --diff-filter=AM "$BASE_SHA" HEAD | \
          grep -E "^sys-kernel/cachyos-sources/cachyos-sources-.*\.ebuild$" | \
          grep -v "9999" | \
          sed -E 's|^sys-kernel/cachyos-sources/cachyos-sources-(.+)\.ebuild$|\1|' | \
          sort -V || true)

        WORKFLOW_CHANGED=$(git diff --no-renames --name-only "$BASE_SHA" HEAD | \
          grep -E "^(\.github/workflows/ebuild-(test(-musl-llvm)?|binpkg-cleanup)\.yml|tests/(ci-.*\.sh|ci_matrix_cases\.py|test-ci-binpkg-lifecycle\.py))$" || true)

        if [ -z "$NEW_EBUILDS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -z "$WORKFLOW_CHANGED" ]; then
          echo "::notice::No new or modified ebuilds detected, skipping tests"
          echo "versions=[]" >> "$GITHUB_OUTPUT"
        else
          if [ -z "$NEW_EBUILDS" ]; then
            echo "Workflow changed or manual dispatch, testing latest version"
            LATEST=$(find sys-kernel/cachyos-sources -name "cachyos-sources-*.ebuild" | \
              grep -v "9999" | \
              sed -E 's|.*cachyos-sources-(.+)\.ebuild$|\1|' | \
              sort -V | tail -1)
            VERSIONS_JSON="[\"$LATEST\"]"
          else
            VERSIONS_JSON="["
            first=true
            for version in $NEW_EBUILDS; do
              if [ "$first" = true ]; then
                VERSIONS_JSON="${VERSIONS_JSON}\"$version\""
                first=false
              else
                VERSIONS_JSON="${VERSIONS_JSON},\"$version\""
              fi
            done
            VERSIONS_JSON="${VERSIONS_JSON}]"
          fi

          echo "Versions to test: $VERSIONS_JSON"
          echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve immutable container image for this run
      id: image
      if: steps.detect.outputs.versions != '[]'
      run: |
        docker pull docker.io/gentoo/stage3:musl-llvm
        IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' docker.io/gentoo/stage3:musl-llvm)
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build-binpkgs:
    needs: detect-versions
    if: needs.detect-versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build uncovered dependency binpkgs once per run
      run: |
        mkdir -p "$RUNNER_TEMP/ci-binpkg"
        printf '%s\n' '${{ needs.detect-versions.outputs.versions }}' | \
          python3 -c 'import json,sys; [print(v) for v in json.load(sys.stdin)]' > "$RUNNER_TEMP/versions.txt"
        docker run --rm --privileged \
          -v "${{ github.workspace }}:/repo:ro" \
          -v "$RUNNER_TEMP/versions.txt:/versions.txt:ro" \
          -v "$RUNNER_TEMP/ci-binpkg:/ci-binpkg" \
          ${{ needs.detect-versions.outputs.image }} \
          /bin/bash -c 'set -euo pipefail; bash /repo/tests/ci-portage-setup.sh musl /repo; bash /repo/tests/ci-binpkg-producer.sh /versions.txt musl'

    - name: Upload local binpkg artifact
      uses: actions/upload-artifact@v4
      with:
        name: ci-binpkgs-musl-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-binpkg/
        if-no-files-found: error
        retention-days: 1
        compression-level: 0

  test:
    needs: [detect-versions, build-binpkgs]
    if: needs.detect-versions.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.versions) }}
        use_flags:
          # Default USE flags - tests the basic musl-llvm emerge path
          - ""

    # NOTE: We do NOT use `container:` here because gentoo/stage3:musl-llvm
    # uses musl libc which cannot run GitHub Actions' Node.js-based actions
    # (actions/checkout etc.). Instead we checkout on the ubuntu host and
    # bind-mount the repo into a docker container.

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download local binpkg artifact
      id: download
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        name: ci-binpkgs-musl-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ci-binpkg

    - name: Require current attempt artifact
      if: steps.download.outcome != 'success'
      run: |
        echo '::error::Dependency artifact unavailable. Artifacts are deleted after each run; use Re-run all jobs, not failed jobs only.'
        exit 1

    - name: Test ebuild in musl-llvm container
      run: |
        docker run --rm --privileged \
          -v "${{ github.workspace }}:/repo:ro" \
          -v "${{ runner.temp }}/ci-binpkg:/ci-binpkg:ro" \
          -e VERSION="${{ matrix.version }}" \
          -e USE_FLAGS="${{ matrix.use_flags }}" \
          ${{ needs.detect-versions.outputs.image }} \
          /bin/bash -c '
        set -e
        set -o pipefail

        bash /repo/tests/ci-portage-setup.sh musl /repo /ci-binpkg
        bash /repo/tests/ci-binpkg-consumer.sh /ci-binpkg "${VERSION}" "${USE_FLAGS}"

        echo "Successfully installed cachyos-sources-${VERSION} on musl-llvm"
        '
